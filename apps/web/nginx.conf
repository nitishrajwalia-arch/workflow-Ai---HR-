# Serves the built app, and proxies the API so the browser only ever talks to
# ONE origin. That matters for more than tidiness: the refresh token is a
# SameSite=Strict cookie, and a cross-origin setup would have to weaken it.

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Do not advertise the version to anyone scanning.
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Hashed asset filenames change whenever their contents do, so they can be
  # cached hard and for ever.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # index.html must NEVER be cached: it is what points at the current asset
  # hashes. A cached one sends returning users to files that no longer exist.
  location = /index.html {
    add_header Cache-Control "no-store, must-revalidate";
  }

  location /api/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # The API rate-limits per IP. Without this every request looks like it came
    # from nginx and the whole company shares one budget.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Photo uploads.
    client_max_body_size 10m;
  }

  location /uploads/ {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
    expires 7d;
  }

  # Single-page app: any unknown path is a route, not a missing file.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # The API sets its own headers; these are for the HTML document itself.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "same-origin" always;
}
